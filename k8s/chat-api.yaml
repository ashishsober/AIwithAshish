apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  labels:
    app: chat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      containers:
        - name: chat-api
          image: chat-api:latest
          imagePullPolicy: Never   # image is built directly into minikube
          ports:
            - containerPort: 5002
          # Chat history DB login (CHAT_DB_HOST/USER/PASSWORD), made by setup/bootstrap.sh. Optional: without
          # it the pod still answers questions and keeps no history.
          envFrom:
            - secretRef:
                name: chat-secrets
                optional: true
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.minikube.internal:11434/v1"   # Ollama running on the host Mac
            - name: QWEN_MODEL
              value: "qwen3:30b-a3b"
            # authz-api says who is a super admin (no daily limit; Admin > Qwen Chat plans). The token is shared
            # through the authz-internal Secret, as for auth-api. Optional: without it, plans apply to everyone
            # and the admin endpoints answer 503.
            - name: AUTHZ_API_URL
              value: "http://authz-api:7100"
            - name: AUTHZ_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authz-internal
                  key: token
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
spec:
  selector:
    app: chat-api
  ports:
    - port: 5002
      targetPort: 5002
